/**
 * 물건 검색
 */
function fnSearch(){
	// 경공매 구분에 따른 분기
	if( $('select[name=estateType]').val() == '' ){
// 		document.frm.action = '/mciEstate/estateList.do';	// 전체목록
		// 전체물건 메뉴 삭제 :: 혹시 몰라서 남겨둠..
		alert('경공매 구분을 선택해주세요.');
		return;
	}else if( $('select[name=estateType]').val() == 'B' ){
		document.frm.action = '/mciEstate/estateBidList.do';	// 경매목록
	}else{
		document.frm.action = '/mciEstate/estateSaleList.do';	// 공매목록
	}
	
	document.frm.submit();
}

/**
 * 물건 상세정보 조회
 */
function fnEstateDtl(estateId){
	// form 생성
	var f = document.createElement('form');
	f.method = 'post';
	f.action = '/mciEstate/estateDtl.do';
	// input 생성
	var inp = document.createElement('input');
	inp.setAttribute('type', 'hidden');
	inp.setAttribute('name', 'estateId');
	inp.setAttribute('value', estateId);
	// form에 자식 추가
	f.appendChild(inp);
	
	var inp2 = document.createElement('input');
	inp2.setAttribute('type', 'hidden');
	inp2.setAttribute('name', 'pageNo');
	inp2.setAttribute('value', 1);
	// form에 자식 추가
	f.appendChild(inp2);
	
	// body에 form 추가
	document.body.appendChild(f);
	// 화면 이동
	f.submit();
}
